<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебный помощник с AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Inter (современный читаемый шрифт) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Библиотека для Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Подсветка синтаксиса (поменяем тему на светлую) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Боковая панель с темами -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-graduation-cap"></i> Темы для изучения</h2>
                <p class="sidebar-subtitle">Выберите тему для детального изучения</p>
            </div>
            <div id="themes-list">
                <!-- Темы будут загружены из JSON -->
            </div>
        </div>

        <!-- Основной чат -->
        <div class="main-content">
            <div class="chat-wrapper">
                <div class="messages" id="messages">
                    <!-- Сообщения будут добавляться здесь -->
                </div>

                <div class="input-area">
                    <div class="typing-indicator" id="typing-indicator" style="display: none;">
                        <div class="typing-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <span class="typing-text">AI печатает ответ...</span>
                    </div>
                    
                    <div class="input-wrapper">
                        <textarea 
                            id="user-input" 
                            placeholder="Напишите ваш вопрос или выберите тему из списка слева..." 
                            rows="1"
                        ></textarea>
                        <button id="send-btn" class="send-button">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <div class="quick-buttons">
                        <button class="quick-btn" data-topic="синтаксис">
                            <i class="fas fa-code"></i> Синтаксис Python
                        </button>
                        <button class="quick-btn" data-topic="функции">
                            <i class="fas fa-cogs"></i> Функции
                        </button>
                        <button class="quick-btn" data-topic="ООП">
                            <i class="fas fa-object-group"></i> ООП
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
